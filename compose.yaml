services:
  api:
    build: .
    environment:
      SLA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SLA_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2);
          assert response.status == 200 and json.load(response) == {'status': 'ready'}
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sla
      POSTGRES_USER: sla
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla -d sla"]
      interval: 2s
      timeout: 3s
      retries: 10

secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt

volumes:
  identity_data:
