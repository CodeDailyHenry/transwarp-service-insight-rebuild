[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sla-assistant"
version = "0.1.0"
description = "API-first backend and CLI for SLA intelligent diagnosis"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "SQLAlchemy==2.0.43",
    "psycopg[binary]==3.2.10",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[project.scripts]
sla = "sla_assistant.cli:main"
sla-admin = "sla_assistant.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
