name: checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sla
          POSTGRES_DB: sla_test
          # Disposable CI-only database, reachable only on the runner loopback interface.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U sla -d sla_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m pytest tests/test_identity.py tests/test_identity_api.py
        env:
          SLA_TEST_POSTGRES_URL: postgresql+psycopg://sla@127.0.0.1:5432/sla_test
      - run: python -m mypy src tests
      - run: ruff check .
      - run: ruff format --check .
